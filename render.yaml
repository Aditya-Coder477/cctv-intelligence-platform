services:
  - type: web
    name: cctv-intelligence-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SENTINEL_AUTH_EMAIL
        sync: false
      - key: SENTINEL_AUTH_PASSWORD
        sync: false
